<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poornata Jump Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <h1>Poornata Jump Master</h1>
        <p>Enter your details to begin</p>
        
        <div class="input-group">
            <label>Name (Alphabets Only)</label>
            <input type="text" id="username" placeholder="Enter Name">
        </div>

        <div class="input-group">
            <label>Poornata ID (Numbers Only)</label>
            <input type="number" id="poornataId" placeholder="Enter ID">
        </div>

        <button id="start-btn">START GAME</button>
        <p id="error-msg" class="hidden"></p>
        <p class="small-link"><a href="admin.html">View History</a></p>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="score-display">Score: 0</div>
            <div id="level-display">Level: 1</div>
            <button id="pause-btn">Pause</button>
        </div>

        <div id="paused-overlay" class="hidden">
            <div class="paused-content">
                <h1>Paused</h1>
                <p id="pause-trivia"></p>
                <button id="resume-btn">Resume</button>
            </div>
        </div>

        <div id="gameover-overlay" class="hidden">
            <div class="paused-content"> <!-- Re-use style -->
                <h1>Game Over!</h1>
                <p id="final-score"></p>
                <p id="gameover-trivia"></p>
                <button id="share-btn">Share Score</button>
                <button id="restart-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
